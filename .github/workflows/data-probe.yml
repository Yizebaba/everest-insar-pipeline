# 珠峰数据探测：① WIS2 实时气象站（中国气象局 + 尼泊尔水文气象局）跑 190 分钟；② 下载南坡气象站 Zenodo 档案。
# 结果提交到 data-probe 分支（不碰 main）。推送到 data-probe 分支或手动触发即可运行。
name: data-probe
on:
  push:
    branches: [data-probe]
    paths: [".github/workflows/data-probe.yml", "tools/wis2_probe.py", "tools/zenodo_fetch.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: data-probe
jobs:
  zenodo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: data-probe}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/zenodo_fetch.py --out data/south_slope
      - name: commit
        run: |
          git config user.name "data-probe-bot"; git config user.email "data-probe-bot@users.noreply.github.com"
          git add data/south_slope
          git commit -m "south slope: Zenodo 18849098 archive" || echo "no change"
          git pull --rebase origin data-probe && git push origin HEAD:data-probe
  wis2:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    needs: zenodo
    steps:
      - uses: actions/checkout@v4
        with: {ref: data-probe}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r tools/requirements.txt
      - run: mkdir -p data/wis2 && python tools/wis2_probe.py --minutes 190 --max-downloads 1500 --out data/wis2/probe_result.json | tee data/wis2/probe_log.txt
      - name: commit
        if: always()
        run: |
          git config user.name "data-probe-bot"; git config user.email "data-probe-bot@users.noreply.github.com"
          git add data/wis2
          git commit -m "wis2 probe result" || echo "no change"
          git pull --rebase origin data-probe && git push origin HEAD:data-probe
