name: Sentinel-1 InSAR Autonomous Pipeline

on:
  schedule:
    - cron: '0 14,16,18 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_auto_coder:
        description: 'Whether to run LangGraph Auto-Coder Agent demonstration'
        required: false
        type: boolean
        default: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LangGraph Auto-Coder Agent
        if: ${{ github.event.inputs.run_auto_coder == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          python auto_coder_agent.py

      - name: Execute Main Pipeline
        env:
          CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python pipeline.py

      - name: Commit and Push Results & Auto-generated Code
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ models/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(agent): commit auto-generated module and updated InSAR results" && git push)