name: Sentinel-1 InSAR Autonomous Pipeline

on:
  schedule:
    # 结合 Sentinel-1 升轨 12 轨每天 UTC 12:13 (北京时间 20:13) 过境规律：
    # 在数据上架窗口期 (UTC 14:00 - 18:00) 每 2 小时精准检测一次；其余时间每天自动保底巡检
    - cron: '0 14,16,18 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline
        env:
          CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python pipeline.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update latest InSAR displacement results" && git push)